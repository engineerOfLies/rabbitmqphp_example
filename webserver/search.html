<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AuxTalks - Search</title>

    <style>
        .album-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .album-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
	        <a class="navbar-brand" href="#">AuxTalks</a>
	        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-l>
	                <span class="navbar-toggler-icon"></span>
	        </button>
	        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
	                <div class="navbar-nav">
	                        <a class="nav-item nav-link" href="home.html">Home</a>
	                        <a class="nav-item nav-link active" href="search.html">Search<span class="sr-only">(current)</span></a>
	                        <a class="nav-item nav-link" href="profile.html">Profile</a>
	                        <a class="nav-item nav-link" href="discussions.html">Discussions</a>
	                </div>

    <h1>Search Albums</h1>
    <p><a href="../home.html">&larr; Back to Dashboard</a></p>

    <form onsubmit="searchAlbum(event)">
        <input type="text" id="album" placeholder="Enter artist or album name" required>
        <button type="submit">Search</button>
    </form>

    <p id="message"></p>
    <div id="results"></div>

    <script>
        function searchAlbum(event) {
            event.preventDefault();

            var queryVal = document.getElementById("album").value.trim();
            if (!queryVal) return;

            var message = document.getElementById("message");
            var results = document.getElementById("results");

            message.textContent = "Searching...";
            results.replaceChildren();

            var data = { query: queryVal };
            var request = new XMLHttpRequest();

            request.open("POST", "search.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function() {
                if (request.readyState === 4) {
                    if (request.status !== 200) {
                        message.textContent = "Search failed (HTTP " + request.status + ").";
                        return;
                    }

                    try {
                        var res = JSON.parse(request.responseText);

                        if (res.status !== "success") {
                            message.textContent = res.message || "Search failed.";
                            return;
                        }

                        // Support both formats: res.results or res.data.results
                        var albums = res.results || (res.data && res.data.results) || [];

                        if (albums.length === 0) {
                            message.textContent = "No albums found.";
                            return;
                        }

                        message.textContent = "";

                        albums.forEach(function(album) {
                            var releaseId = album.discogs_release_id || album.id || 0;
                            var coverImg = album.thumb || album.cover_image || "https://via.placeholder.com/100x100?text=No+Cover";
                            var year = album.year || album.release_year || "Unknown Year";
                            var format = album.format || album.format_summary || "Standard";

                            var card = document.createElement("div");
                            card.className = "album-item";

                            card.innerHTML = 
                                '<img src="' + coverImg + '" alt="cover" />' +
                                '<div class="result-info">' +
                                    '<h3><a href="album.html?id=' + releaseId + '">' + (album.title || "Unknown Title") + '</a></h3>' +
                                    '<p>Year: ' + year + '</p>' +
                                    '<p>Format: ' + format + '</p>' +
                                '</div>' +
                                '<div>' +
                                    '<button class="btn-view" onclick="window.location.href=\'album.html?id=' + releaseId + '\'">View Album</button>' +
                                '</div>';

                            results.appendChild(card);
                        });

                    } catch (error) {
                        console.error("Parse or render error:", error, request.responseText);
                        message.textContent = "Invalid server response.";
                    }
                }
            };

            request.send(JSON.stringify(data));
        }

		function checkSession() {
			var request = new XMLHttpRequest();
			request.open("POST", "login.php", true);
			request.setRequestHeader("Content-Type", "application/json");

			request.onreadystatechange = function () {
				if (request.readyState === 4 && request.status === 200){
					var res = JSON.parse(request.responseText);

					if (res.status === "success") {

					} else {
						window.location.href = "login.html";
					}
				}
			};
			
			request.send(JSON.stringify({type: "validate_session"}));
		}

		window.onload = checkSession;
    </script>

</body>
</html>
